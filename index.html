<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pulsera de Resonancia — ECOS</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;}
  canvas{display:block;}
  #info{
    position:fixed; left:16px; bottom:16px; color:#7fd4e8;
    font-family:'Segoe UI',Arial,sans-serif; font-size:12px; opacity:0.65;
    letter-spacing:0.03em;
  }
  #title{
    position:fixed; left:16px; top:16px; color:#cfeffb;
    font-family:'Segoe UI',Arial,sans-serif; font-size:14px; opacity:0.85;
    letter-spacing:0.15em; text-transform:uppercase;
  }
</style>
</head>
<body>
<div id="title">Pulsera de Resonancia · ECOS</div>
<div id="info">Arrastra para rotar · rueda para acercar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.FogExp2(0x05070a, 0.035);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ---- luces ----
scene.add(new THREE.AmbientLight(0x223344, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(3, 4, 3);
scene.add(key);
const rim = new THREE.DirectionalLight(0x3fa9dd, 0.5);
rim.position.set(-3, -1, -3);
scene.add(rim);
const moduleLight = new THREE.PointLight(0x2fd0f5, 2.2, 4);
scene.add(moduleLight);

// ---- materiales ----
const metalMat = new THREE.MeshStandardMaterial({color:0x2b2f33, metalness:0.9, roughness:0.42});
const metalMatLight = new THREE.MeshStandardMaterial({color:0x4a4f55, metalness:0.85, roughness:0.35});
const rubberMat = new THREE.MeshStandardMaterial({color:0x0a0a0c, metalness:0.1, roughness:0.92});
const glowMat = new THREE.MeshStandardMaterial({color:0x1fc8f0, emissive:0x1fc8f0, emissiveIntensity:2.4, metalness:0.2, roughness:0.3});
const glowCoreMat = new THREE.MeshStandardMaterial({color:0x9fe8fb, emissive:0x38d0f5, emissiveIntensity:3.2, metalness:0.1, roughness:0.2});

// ---- textura de resplandor (para sprites aditivos, simula bloom) ----
function makeGlowTexture(){
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(180,240,255,1)');
  grad.addColorStop(0.35, 'rgba(60,200,240,0.55)');
  grad.addColorStop(1, 'rgba(20,100,140,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const glowTex = makeGlowTexture();
function addGlowSprite(parent, position, scale){
  const mat = new THREE.SpriteMaterial({map:glowTex, color:0x8fe8fb, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(position);
  sprite.scale.set(scale, scale, 1);
  parent.add(sprite);
  return sprite;
}

// ---- grupo principal de la pulsera ----
const braceletGroup = new THREE.Group();
scene.add(braceletGroup);

const glowSprites = [];

// banda: anillo de segmentos metálicos y de caucho
const segCount = 28;
const radius = 1.3;
for(let i=0;i<segCount;i++){
  const angle = (i/segCount) * Math.PI * 2;
  const isRubber = i % 5 === 0;
  const mat = isRubber ? rubberMat : (i % 3 === 0 ? metalMatLight : metalMat);
  const geo = new THREE.BoxGeometry(0.28, 0.34, 0.14);
  const seg = new THREE.Mesh(geo, mat);
  seg.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
  seg.lookAt(0, 0, 0);
  braceletGroup.add(seg);

  if(i % 7 === 3){
    const led = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.16), glowMat);
    led.position.copy(seg.position);
    led.lookAt(0, 0, 0);
    braceletGroup.add(led);
    glowSprites.push(addGlowSprite(braceletGroup, seg.position, 0.35));
  }
}

// módulo de resonancia (disco central)
const moduleGroup = new THREE.Group();
moduleGroup.position.set(0, 0, radius + 0.05);
braceletGroup.add(moduleGroup);

const baseDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.22, 48), metalMatLight);
baseDisc.rotation.x = Math.PI / 2;
moduleGroup.add(baseDisc);

const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.035, 16, 64), metalMat);
moduleGroup.add(rimRing);

const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 16, 64), glowMat);
moduleGroup.add(ring1);

const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.018, 16, 64), metalMat);
moduleGroup.add(ring2);

const core = new THREE.Mesh(new THREE.SphereGeometry(0.14, 32, 32), glowCoreMat);
moduleGroup.add(core);
moduleLight.position.copy(moduleGroup.position);

// emblema triangular
const triShape = new THREE.Shape();
triShape.moveTo(0, 0.12);
triShape.lineTo(0.1, -0.08);
triShape.lineTo(-0.1, -0.08);
triShape.lineTo(0, 0.12);
const triGeo = new THREE.ExtrudeGeometry(triShape, {depth:0.02, bevelEnabled:false});
const triangle = new THREE.Mesh(triGeo, glowMat);
triangle.position.set(0, 0, 0.13);
moduleGroup.add(triangle);

glowSprites.push(addGlowSprite(moduleGroup, new THREE.Vector3(0,0,0.15), 1.1));

// ---- controles de cámara (arrastrar para rotar, rueda para zoom) ----
let camRadius = 4.6, theta = 0.5, phi = 1.25;
function updateCamera(){
  camera.position.x = camRadius * Math.sin(phi) * Math.sin(theta);
  camera.position.z = camRadius * Math.sin(phi) * Math.cos(theta);
  camera.position.y = camRadius * Math.cos(phi);
  camera.lookAt(0, 0, 0);
}
updateCamera();

let dragging = false, prevX = 0, prevY = 0;
renderer.domElement.style.touchAction = 'none';
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if(!dragging) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  theta -= dx * 0.006;
  phi = Math.max(0.35, Math.min(Math.PI - 0.35, phi - dy * 0.006));
  prevX = e.clientX; prevY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  camRadius = Math.max(2.6, Math.min(8, camRadius + e.deltaY * 0.002));
  updateCamera();
  e.preventDefault();
}, {passive:false});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- animación ----
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  braceletGroup.rotation.y = t * 0.25;
  braceletGroup.position.y = Math.sin(t * 0.6) * 0.06;

  const pulse = 2.1 + Math.sin(t * 2.4) * 1.0;
  glowMat.emissiveIntensity = pulse;
  glowCoreMat.emissiveIntensity = pulse * 1.4;
  moduleLight.intensity = 1.6 + Math.sin(t * 2.4) * 0.8;
  glowSprites.forEach(s => { s.material.opacity = 0.55 + Math.sin(t * 2.4) * 0.25; });

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

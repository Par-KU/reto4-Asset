<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsera de Resonancia — ECOS</title>

<style>
    *{
        box-sizing:border-box;
    }

    html,body{
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:#05070a;
    }

    canvas{
        display:block;
    }

    #title{
        position:fixed;
        left:24px;
        top:22px;
        color:#d9f5ff;
        font-family:'Segoe UI',Arial,sans-serif;
        font-size:15px;
        font-weight:500;
        letter-spacing:.18em;
        text-transform:uppercase;
        z-index:10;
    }

    #subtitle{
        position:fixed;
        left:24px;
        top:50px;
        color:#69cce9;
        font-family:'Segoe UI',Arial,sans-serif;
        font-size:11px;
        letter-spacing:.16em;
        text-transform:uppercase;
        opacity:.75;
        z-index:10;
    }

    #info{
        position:fixed;
        left:24px;
        bottom:22px;
        color:#8bbdcc;
        font-family:'Segoe UI',Arial,sans-serif;
        font-size:11px;
        opacity:.65;
        letter-spacing:.04em;
        z-index:10;
    }

    #status{
        position:fixed;
        right:24px;
        top:22px;
        color:#8bdff5;
        font-family:'Segoe UI',Arial,sans-serif;
        font-size:11px;
        letter-spacing:.12em;
        text-transform:uppercase;
        opacity:.7;
        z-index:10;
    }

    #activate{
        position:fixed;
        right:24px;
        bottom:24px;
        padding:11px 18px;
        border:1px solid rgba(80,200,235,.45);
        background:rgba(5,15,20,.72);
        color:#a9e9fa;
        font-family:'Segoe UI',Arial,sans-serif;
        font-size:11px;
        letter-spacing:.12em;
        text-transform:uppercase;
        cursor:pointer;
        transition:.25s;
        z-index:20;
    }

    #activate:hover{
        background:rgba(25,90,110,.35);
        border-color:#67dfff;
    }
</style>
</head>

<body>

<div id="title">Pulsera de Resonancia · ECOS</div>
<div id="subtitle">La ciudad que te recuerda</div>
<div id="status">Estado: Inactiva</div>

<div id="info">
    Arrastra para rotar · rueda para acercar · tecla E para activar
</div>

<button id="activate">Activar Resonancia</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   ESCENA
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070a);

scene.fog = new THREE.FogExp2(
    0x05070a,
    0.035
);


/* =========================================================
   CÁMARA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    1.4,
    5
);


/* =========================================================
   RENDER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LUCES
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0x24333c,
        0.7
    );

scene.add(ambient);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.25
    );

keyLight.position.set(
    3,
    4,
    5
);

scene.add(keyLight);


const fillLight =
    new THREE.DirectionalLight(
        0x497d91,
        0.5
    );

fillLight.position.set(
    -4,
    1,
    2
);

scene.add(fillLight);


const rimLight =
    new THREE.DirectionalLight(
        0x24bce8,
        0.8
    );

rimLight.position.set(
    -3,
    2,
    -4
);

scene.add(rimLight);


/* =========================================================
   MATERIALES
========================================================= */

const metalDark =
    new THREE.MeshStandardMaterial({
        color:0x20252a,
        metalness:.92,
        roughness:.42
    });


const metal =
    new THREE.MeshStandardMaterial({
        color:0x4a5056,
        metalness:.9,
        roughness:.34
    });


const metalLight =
    new THREE.MeshStandardMaterial({
        color:0x70767b,
        metalness:.85,
        roughness:.28
    });


const rubber =
    new THREE.MeshStandardMaterial({
        color:0x090b0d,
        metalness:.05,
        roughness:.9
    });


const glow =
    new THREE.MeshStandardMaterial({
        color:0x18c9f2,
        emissive:0x18c9f2,
        emissiveIntensity:2.8,
        metalness:.15,
        roughness:.25
    });


const glowCore =
    new THREE.MeshStandardMaterial({
        color:0xc9f7ff,
        emissive:0x2ed8ff,
        emissiveIntensity:4,
        metalness:.1,
        roughness:.18
    });


/* =========================================================
   GRUPO PRINCIPAL
========================================================= */

const bracelet =
    new THREE.Group();

scene.add(bracelet);


/* =========================================================
   CORREA PRINCIPAL
========================================================= */

const braceletRadius = 1.35;

const strapGeometry =
    new THREE.TorusGeometry(
        braceletRadius,
        .20,
        16,
        96
    );

const strap =
    new THREE.Mesh(
        strapGeometry,
        rubber
    );

bracelet.add(strap);


/* =========================================================
   PLACAS METÁLICAS
========================================================= */

const plateCount = 18;

for(let i=0;i<plateCount;i++){

    const angle =
        (i / plateCount) *
        Math.PI * 2;

    const x =
        Math.sin(angle) *
        braceletRadius;

    const z =
        Math.cos(angle) *
        braceletRadius;

    const plateGeometry =
        new THREE.BoxGeometry(
            .42,
            .28,
            .10
        );

    const material =
        i % 4 === 0
        ? metalLight
        : metal;

    const plate =
        new THREE.Mesh(
            plateGeometry,
            material
        );

    plate.position.set(
        x,
        0,
        z
    );

    /*
       Orientamos cada placa siguiendo
       la curvatura de la pulsera.
    */

    plate.rotation.y =
        angle;

    bracelet.add(plate);


    /* pequeños tornillos */

    if(i % 2 === 0){

        const screwGeometry =
            new THREE.CylinderGeometry(
                .025,
                .025,
                .018,
                12
            );

        const screw =
            new THREE.Mesh(
                screwGeometry,
                metalDark
            );

        screw.position.set(
            x,
            .14,
            z
        );

        screw.rotation.x =
            Math.PI / 2;

        bracelet.add(screw);
    }
}


/* =========================================================
   LINEAS LUMINOSAS LATERALES
========================================================= */

for(let i=0;i<12;i++){

    const angle =
        (i / 12) *
        Math.PI * 2;

    const x =
        Math.sin(angle) *
        1.36;

    const z =
        Math.cos(angle) *
        1.36;

    const ledGeometry =
        new THREE.BoxGeometry(
            .18,
            .035,
            .025
        );

    const led =
        new THREE.Mesh(
            ledGeometry,
            glow
        );

    led.position.set(
        x,
        0,
        z
    );

    led.rotation.y =
        angle;

    bracelet.add(led);
}


/* =========================================================
   MÓDULO CENTRAL
========================================================= */

const module =
    new THREE.Group();

module.position.set(
    0,
    0,
    1.48
);

bracelet.add(module);


/* cuerpo principal */

const moduleBody =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .58,
            .58,
            .25,
            64
        ),
        metal
    );

moduleBody.rotation.x =
    Math.PI / 2;

module.add(moduleBody);


/* anillo exterior */

const outerRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .53,
            .055,
            16,
            64
        ),
        metalDark
    );

module.add(outerRing);


/* segundo anillo */

const energyRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .43,
            .035,
            16,
            64
        ),
        glow
    );

module.add(energyRing);


/* anillo interno */

const innerRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .31,
            .025,
            12,
            48
        ),
        metalLight
    );

module.add(innerRing);


/* núcleo */

const core =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .14,
            32,
            32
        ),
        glowCore
    );

core.position.z =
    .15;

module.add(core);


/* =========================================================
   TRIÁNGULO DE ECOS
========================================================= */

const triangleShape =
    new THREE.Shape();

triangleShape.moveTo(
    0,
    .16
);

triangleShape.lineTo(
    .14,
    -.10
);

triangleShape.lineTo(
    -.14,
    -.10
);

triangleShape.lineTo(
    0,
    .16
);

const triangleGeometry =
    new THREE.ExtrudeGeometry(
        triangleShape,
        {
            depth:.035,
            bevelEnabled:true,
            bevelThickness:.008,
            bevelSize:.008,
            bevelSegments:2
        }
    );

const triangle =
    new THREE.Mesh(
        triangleGeometry,
        glow
    );

triangle.position.set(
    0,
    0,
    .20
);

module.add(triangle);


/* =========================================================
   DETALLES LATERALES DEL MÓDULO
========================================================= */

for(let side of [-1,1]){

    const sideBlock =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                .32,
                .18
            ),
            metalDark
        );

    sideBlock.position.set(
        side * .53,
        0,
        0
    );

    sideBlock.rotation.z =
        side * .12;

    module.add(sideBlock);
}


/* =========================================================
   TORNILLOS DEL MÓDULO
========================================================= */

const screwPositions = [
    [-.42,.30],
    [.42,.30],
    [-.42,-.30],
    [.42,-.30]
];

screwPositions.forEach(p => {

    const screw =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .025,
                .025,
                .025,
                12
            ),
            metalLight
        );

    screw.position.set(
        p[0],
        p[1],
        .14
    );

    screw.rotation.x =
        Math.PI / 2;

    module.add(screw);
});


/* =========================================================
   LUZ DEL MÓDULO
========================================================= */

const moduleLight =
    new THREE.PointLight(
        0x25d8ff,
        2.4,
        4
    );

moduleLight.position.copy(
    module.position
);

scene.add(moduleLight);


/* =========================================================
   HALO DE RESONANCIA
========================================================= */

function createGlowTexture(){

    const canvas =
        document.createElement('canvas');

    canvas.width =
        canvas.height =
        128;

    const ctx =
        canvas.getContext('2d');

    const gradient =
        ctx.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );

    gradient.addColorStop(
        0,
        'rgba(190,245,255,1)'
    );

    gradient.addColorStop(
        .3,
        'rgba(40,210,255,.55)'
    );

    gradient.addColorStop(
        1,
        'rgba(0,100,160,0)'
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        128,
        128
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


const glowTexture =
    createGlowTexture();


const haloMaterial =
    new THREE.SpriteMaterial({
        map:glowTexture,
        color:0x58ddff,
        transparent:true,
        opacity:.45,
        depthWrite:false,
        blending:
            THREE.AdditiveBlending
    });


const halo =
    new THREE.Sprite(
        haloMaterial
    );

halo.position.set(
    0,
    0,
    .28
);

halo.scale.set(
    1.2,
    1.2,
    1
);

module.add(halo);


/* =========================================================
   ONDA DE RESONANCIA
========================================================= */

const resonanceRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .72,
            .012,
            8,
            64
        ),
        glow
    );

resonanceRing.position.set(
    0,
    0,
    .32
);

resonanceRing.scale.set(
    .01,
    .01,
    .01
);

module.add(
    resonanceRing
);


/* =========================================================
   ESTADO DE RESONANCIA
========================================================= */

let resonanceActive =
    false;

let resonanceTimer =
    0;

const status =
    document.getElementById(
        'status'
    );

const activateButton =
    document.getElementById(
        'activate'
    );


function activateResonance(){

    resonanceActive = true;

    resonanceTimer = 0;

    status.textContent =
        'Estado: Resonancia activa';

    activateButton.textContent =
        'Resonancia activa';
}


/* botón */

activateButton.addEventListener(
    'click',
    activateResonance
);


/* tecla E */

window.addEventListener(
    'keydown',
    e => {

        if(
            e.key.toLowerCase() === 'e'
        ){

            activateResonance();

        }

    }
);


/* =========================================================
   CONTROLES DE CÁMARA
========================================================= */

let camRadius = 4.7;

let theta = 0.35;

let phi = 1.35;


function updateCamera(){

    camera.position.x =
        camRadius *
        Math.sin(phi) *
        Math.sin(theta);

    camera.position.z =
        camRadius *
        Math.sin(phi) *
        Math.cos(theta);

    camera.position.y =
        camRadius *
        Math.cos(phi);

    camera.lookAt(
        0,
        0,
        0
    );
}

updateCamera();


let dragging =
    false;

let previousX =
    0;

let previousY =
    0;


renderer.domElement.style.touchAction =
    'none';


renderer.domElement.addEventListener(
    'pointerdown',
    e => {

        dragging = true;

        previousX =
            e.clientX;

        previousY =
            e.clientY;

    }
);


window.addEventListener(
    'pointerup',
    () => {

        dragging = false;

    }
);


window.addEventListener(
    'pointermove',
    e => {

        if(!dragging)
            return;

        const dx =
            e.clientX -
            previousX;

        const dy =
            e.clientY -
            previousY;

        theta -=
            dx * .006;

        phi =
            Math.max(
                .35,
                Math.min(
                    Math.PI-.35,
                    phi - dy*.006
                )
            );

        previousX =
            e.clientX;

        previousY =
            e.clientY;

        updateCamera();

    }
);


renderer.domElement.addEventListener(
    'wheel',
    e => {

        camRadius +=
            e.deltaY * .002;

        camRadius =
            Math.max(
                2.8,
                Math.min(
                    8,
                    camRadius
                )
            );

        updateCamera();

        e.preventDefault();

    },
    {
        passive:false
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    'resize',
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMACIÓN
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    /* rotación lenta */

    bracelet.rotation.y =
        time * .18;


    /* movimiento suave */

    bracelet.position.y =
        Math.sin(
            time * .7
        ) * .035;


    /* pulso normal */

    let pulse =
        2.5 +
        Math.sin(
            time * 2.2
        ) * .7;


    /* activación */

    if(resonanceActive){

        resonanceTimer +=
            .016;

        pulse =
            4 +
            Math.sin(
                time * 8
            ) * 2;

        resonanceRing.scale.set(
            1 + Math.sin(time*5)*.15,
            1 + Math.sin(time*5)*.15,
            1
        );

        resonanceRing.rotation.z =
            time * 2;

        halo.scale.set(
            1.2 +
            Math.sin(time*5)*.2,
            1.2 +
            Math.sin(time*5)*.2,
            1
        );

        /*
           Después de unos segundos
           vuelve al estado normal.
        */

        if(resonanceTimer > 4){

            resonanceActive =
                false;

            status.textContent =
                'Estado: Inactiva';

            activateButton.textContent =
                'Activar Resonancia';

            resonanceRing.scale.set(
                .01,
                .01,
                .01
            );
        }

    }


    glow.emissiveIntensity =
        pulse;


    glowCore.emissiveIntensity =
        pulse * 1.35;


    moduleLight.intensity =
        resonanceActive
        ? 4.5
        : 2.2 +
          Math.sin(
              time*2.2
          )*.5;


    haloMaterial.opacity =
        resonanceActive
        ? .8
        : .35 +
          Math.sin(
              time*2.2
          )*.12;


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
